site_name: GameTemplate
site_description: A generic Unreal Engine 5 game project template with an agentic dev framework and full DevOps tooling.
repo_url: https://github.com/YOUR_ORG/Unreal-Game-Template
docs_dir: Docs
site_dir: Docs/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo

nav:
  - Documentation Standards: DOCUMENTATION_STANDARDS.md
  - Benchmarks: BENCHMARKS.md
  - Dependencies: DEPENDENCIES.md
  - Dependency Policy: DEPENDENCY_POLICY.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Development: DEVELOPMENT.md
  - Glossary: GLOSSARY.md
  - Testing: TESTING.md
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Changelog: CHANGELOG.md
  - Architecture Decision Records:
      - ADR 1: Record Architecture Decisions: adr/0001-record-architecture-decisions.md
  - Contributing: ../Git/CONTRIBUTING.md
  - Roadmap: Docs/Moon/ROADMAP.md
  - Research: Moon/Research/TEMPLATE.md
  - Reports: Moon/Reports/TEMPLATE.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
