apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gametemplate-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: gametemplate-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"

  - target:
      kind: Ingress
      name: gametemplate-server-status
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: status.gametemplate.example.com
