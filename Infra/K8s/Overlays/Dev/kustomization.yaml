apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gametemplate-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: gametemplate-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Ingress
      name: gametemplate-server-status
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: status.dev.gametemplate.example.com
