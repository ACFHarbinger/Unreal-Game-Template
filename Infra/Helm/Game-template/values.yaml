replicaCount: 1

image:
  repository: YOUR_REGISTRY/gametemplate-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 7777

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

env:
  SERVER_PORT: "7777"
  MATCHMAKER_HOST: "matchmaker"
  MATCHMAKER_PORT: "6379"

ingress:
  enabled: false
  host: status.gametemplate.example.com
