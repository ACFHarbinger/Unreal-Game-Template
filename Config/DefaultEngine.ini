; Unreal-Game-Template — Engine configuration.
;
; NOTE: hand-authored (no licensed UE5 install was available to generate/
; verify this via the Editor's Project Settings UI). The exact field names
; below match documented 5.x ini syntax as of this writing, but have not
; been round-tripped through the Editor — if any section fails to parse,
; open Project Settings once in-editor and let it rewrite the offending
; block; the intent of each section is described in its comment either way.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/GameTemplate.GameTemplateGameMode
; EditorStartupMap/GameDefaultMap point at a level that doesn't exist yet —
; see Content/README.md for the one required manual step (File > New Level
; > Empty Level > Save As Content/Maps/TestMap). Referencing it before
; creation is harmless; the engine falls back to its own default until this
; path resolves.
EditorStartupMap=/Game/Maps/TestMap.TestMap
GameDefaultMap=/Game/Maps/TestMap.TestMap

[/Script/Engine.PhysicsSettings]
; Mandatory per .agent/rules/physics_collision.md — prevents fast-moving
; actors tunneling through thin colliders at high velocity between rendered
; frames.
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=6

[/Script/Engine.CollisionProfile]
; Example custom Object Channel names — replace/extend with what your
; actual gameplay needs (Source/GameTemplate/Physics/GameTemplateCollisionChannels.h
; holds the C++-side aliases). Per-actor Block/Overlap/Ignore responses are
; set explicitly in C++ constructors, not via named presets here — see
; Moon/Roadmaps/physics_collision.md §2 for the rationale.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=False,bStaticObject=False,Name="Interactable")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Ignore,bTraceType=False,bStaticObject=False,Name="Hazard")
