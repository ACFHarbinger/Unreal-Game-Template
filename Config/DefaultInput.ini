; Unreal-Game-Template — Legacy input config placeholder.
;
; UE 5.5 defaults to Enhanced Input (Input Mapping Contexts + Input Actions
; as Content/ Data Assets, not .ini-defined bindings), so there is
; intentionally nothing to configure here yet. This file exists as the
; conventional location third-party plugins / legacy input fallback checks
; expect to find; leave it in place even though it's currently empty of
; bindings.
;
; When you add Enhanced Input mapping contexts, they live as Content/
; Data Assets (binary, Git LFS) referenced from
; Source/GameTemplate/Core/GameTemplatePlayerController.cpp — see
; Moon/Roadmaps/ui_ux.md for the planned input-handling work.

[/Script/Engine.InputSettings]
bEnableLegacyInputScales=False
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
