name: Agent Backlog Sync

on:
  push:
    branches: [main]
    paths:
      - "Moon/ROADMAP.md"
      - "Docs/CHANGELOG.md"

concurrency:
  group: agent-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-backlog:
    name: Agent-driven Project Board sync
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need HEAD~1 to diff the pushed commit

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Run backlog sync
        run: uv run --with requests python Tools/Ci/sync_backlog.py
        env:
          PYTHONPATH: .
          GH_PROJECT_TOKEN: ${{ secrets.PROJECT_ISSUES_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_PROJECT_OWNER: ${{ github.repository_owner }}
